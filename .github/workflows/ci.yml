name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Switch to @ci-v1 once mishka-group/mishka_cms#77 is merged and tagged.
    uses: mishka-group/mishka_cms/.github/workflows/mishka-ci.yml@ci-v1
    with:
      postgres: true
      partitions: 4
      pre-test: |
        mix ash.codegen ci
        mix tailwind.install --if-missing
      tailwind-cache: true
      credo: false
      dialyzer: false
      ex_dna: false
